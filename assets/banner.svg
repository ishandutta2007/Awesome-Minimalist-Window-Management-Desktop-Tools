-in-out infinite;transform-origin:center}.win2{animation:floatWindow2 9s ease-in-out infinite}.grid-pulse{animation:pulseCard 5s ease-in-out infinite}.dot-pulse1{animation:pulseDot 3s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><g stroke="#94a3b8" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="40" y2="40" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="120" y2="120" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="200" y2="200" stroke-dasharray="4 6"/><line x1="0" x2="1200" y1="280" y2="280" stroke-dasharray="4 6"/><line x1="160" x2="160" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="360" x2="360" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="600" x2="600" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="840" x2="840" y1="0" y2="360" stroke-dasharray="4 6"/><line x1="1040" x2="1040" y1="0" y2="360" stroke-dasharray="4 6"/></g><circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#neonGlow)" opacity=".08"/><circle cx="1020" cy="220" r="160" fill="#a855f7" filter="url(#neonGlow)" opacity=".08"/><g class="win1" filter="url(#shadowFilter)"><rect width="230" height="250" x="50" y="55" fill="#131b2e" stroke="url(#windowBorderGrad)" stroke-width="1.2" opacity=".55" rx="12"/><rect width="230" height="28" x="50" y="55" fill="#1e293b" opacity=".6" rx="12"/><circle cx="70" cy="69" r="4" fill="#ef4444" opacity=".8"/><circle cx="84" cy="69" r="4" fill="#f59e0b" opacity=".8"/><circle cx="98" cy="69" r="4" fill="#10b981" opacity=".8"/><text x="120" y="73" fill="#64748b" font-family="monospace" font-size="10">tmux : yabai / bsp</text><rect width="90" height="8" x="70" y="98" fill="#38bdf8" opacity=".4" rx="4"/><rect width="140" height="6" x="70" y="118" fill="#475569" opacity=".5" rx="3"/><rect width="110" height="6" x="70" y="134" fill="#475569" opacity=".4" rx="3"/><rect width="160" height="6" x="70" y="150" fill="#6366f1" opacity=".3" rx="3"/><rect width="194" height="110" x="68" y="174" fill="#0b0f19" stroke="